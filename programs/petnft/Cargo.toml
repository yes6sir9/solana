[package]
name = "petnft"
version = "0.1.0"
description = "PetNFT on-chain pet registry — pairs a PDA record with a Metaplex NFT mint"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "petnft"

[features]
no-entrypoint = []
no-idl = []
no-log-ip = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
